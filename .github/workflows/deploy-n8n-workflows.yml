name: Deploy n8n Workflows

on:
  push:
    branches: [main]
    paths:
      - 'n8n-workflows/*.json'
      - '!n8n-workflows/*.credentials.json'

jobs:
  deploy:
    name: Atualizar workflows no n8n via API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy cada workflow mapeado
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -e

          # Usa curl (não urllib do Python) — o urllib tem assinatura de
          # requisição que a Cloudflare bloqueia como bot (HTTP 403,
          # error code 1010), mesmo com o Service Token correto nos headers.

          mapfile -t ENTRIES < <(jq -r 'to_entries[] | select(.key != "_comment") | "\(.key)\t\(.value)"' n8n-workflows/.deploy-map.json)

          FAILED=0
          for entry in "${ENTRIES[@]}"; do
            FILENAME="${entry%%$'\t'*}"
            WORKFLOW_ID="${entry#*$'\t'}"
            FILE_PATH="n8n-workflows/$FILENAME"

            if [ ! -f "$FILE_PATH" ]; then
              echo "⚠️  $FILENAME não encontrado, pulando"
              continue
            fi

            # settings.binaryMode não é aceito pelo schema da API pública
            # (rejeita com "must NOT have additional properties"), mesmo
            # aparecendo no GET — sempre remover antes de enviar.
            jq '{name, nodes, connections, settings: (.settings // {} | del(.binaryMode))}' "$FILE_PATH" > /tmp/body.json

            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X PUT \
              -H "Content-Type: application/json" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "X-N8N-API-KEY: $N8N_API_KEY" \
              --data @/tmp/body.json \
              "https://n8n.jpxdigital.com.br/api/v1/workflows/$WORKFLOW_ID")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ $FILENAME -> $WORKFLOW_ID (HTTP $HTTP_CODE)"
            else
              echo "✗ $FILENAME -> $WORKFLOW_ID FALHOU: HTTP $HTTP_CODE — $(head -c 300 /tmp/resp.json)"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "Um ou mais workflows falharam."
            exit 1
          fi
          echo ""
          echo "Todos os workflows mapeados foram atualizados."
